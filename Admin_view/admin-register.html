<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Registration | InternConnect</title>
</head>

<body>

    <center>

        <h1>InternConnect</h1>

        <p>
            <em>Admin Registration</em>
        </p>

        <hr>

        <h2>Create an Admin Account</h2>

        <p>
            Please enter your information to register as an administrator.
        </p>

        <br>

        <form action="admin-portal.html" method="get">

            <label for="full-name">
                <strong>Full Name</strong>
            </label>

            <br><br>

            <input type="text"
                   id="full-name"
                   name="full_name"
                   placeholder="Enter your full name"
                   size="35"
                   required>

            <br><br>

            <label for="admin-id">
                <strong>Admin ID</strong>
            </label>

            <br><br>

            <input type="text"
                   id="admin-id"
                   name="admin_id"
                   placeholder="Create an admin ID"
                   size="35"
                   required>

            <br><br>

            <label for="email">
                <strong>Email Address</strong>
            </label>

            <br><br>

            <input type="email"
                   id="email"
                   name="email"
                   placeholder="Enter your email address"
                   size="35"
                   required>

            <br><br>

            <label for="phone">
                <strong>Contact Number</strong>
            </label>

            <br><br>

            <input type="tel"
                   id="phone"
                   name="phone"
                   placeholder="Enter your contact number"
                   size="35"
                   required>

            <br><br>

            <label for="password">
                <strong>Password</strong>
            </label>

            <br><br>

            <input type="password"
                   id="password"
                   name="password"
                   placeholder="Create a password"
                   size="35"
                   required>

            <br><br>

            <label for="confirm-password">
                <strong>Confirm Password</strong>
            </label>

            <br><br>

            <input type="password"
                   id="confirm-password"
                   name="confirm_password"
                   placeholder="Re-enter your password"
                   size="35"
                   required>

            <br><br>

            <label for="security-code">
                <strong>Admin Security Code</strong>
            </label>

            <br><br>

            <input type="text"
                   id="security-code"
                   name="security_code"
                   placeholder="Enter the security code"
                   size="35"
                   required>

            <br><br>

            <button type="submit">
                <big>Register as Admin</big>
            </button>

        </form>

        <br>

        <p>
            Already have an account?
            <a href="login.html">Log In</a>
        </p>

        <p>
            <a href="registration-choice.html">
                Back to Account Type Selection
            </a>
        </p>

        <p>
            <a href="homepage.html">Back to Homepage</a>
        </p>

        <hr>

        <p>
            <small>&copy; 2026 InternConnect</small>
        </p>

    </center>

</body>

</html>
