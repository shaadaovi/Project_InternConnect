
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration | InternConnect</title>
</head>

<body>

    <center>

        <h1>InternConnect</h1>

        <p>
            <em>Student Registration</em>
        </p>

        <hr>

        <h2>Create Your Student Account</h2>

        <p>
            Register to find internships and begin your career journey.
        </p>

        <br>

        <form action="student-portal.html" method="get">

            <label for="full-name">
                <strong>Full Name</strong>
            </label>

            <br><br>

            <input type="text"
                   id="full-name"
                   name="full_name"
                   placeholder="Enter your full name"
                   size="35"
                   required>

            <br><br>

            <label for="student-id">
                <strong>Student ID</strong>
            </label>

            <br><br>

            <input type="text"
                   id="student-id"
                   name="student_id"
                   placeholder="Enter your student ID"
                   size="35"
                   required>

            <br><br>

            <label for="university">
                <strong>University Name</strong>
            </label>

            <br><br>

            <input type="text"
                   id="university"
                   name="university"
                   placeholder="Enter your university name"
                   size="35"
                   required>

            <br><br>

            <label for="program">
                <strong>Program or Department</strong>
            </label>

            <br><br>

            <input type="text"
                   id="program"
                   name="program"
                   placeholder="Enter your program or department"
                   size="35"
                   required>

            <br><br>

            <label for="study-year">
                <strong>Current Year of Study</strong>
            </label>

            <br><br>

            <select id="study-year" name="study_year" required>
                <option value="">-- Select your year --</option>
                <option value="first-year">First Year</option>
                <option value="second-year">Second Year</option>
                <option value="third-year">Third Year</option>
                <option value="fourth-year">Fourth Year</option>
                <option value="postgraduate">Postgraduate</option>
            </select>

            <br><br>

            <label for="email">
                <strong>Email Address</strong>
            </label>

            <br><br>

            <input type="email"
                   id="email"
                   name="email"
                   placeholder="Enter your email address"
                   size="35"
                   required>

            <br><br>

            <label for="phone">
                <strong>Contact Number</strong>
            </label>

            <br><br>

            <input type="tel"
                   id="phone"
                   name="phone"
                   placeholder="Enter your contact number"
                   size="35"
                   required>

            <br><br>

            <label for="password">
                <strong>Password</strong>
            </label>

            <br><br>

            <input type="password"
                   id="password"
                   name="password"
                   placeholder="Create a password"
                   size="35"
                   required>

            <br><br>

            <label for="confirm-password">
                <strong>Confirm Password</strong>
            </label>

            <br><br>

            <input type="password"
                   id="confirm-password"
                   name="confirm_password"
                   placeholder="Re-enter your password"
                   size="35"
                   required>

            <br><br>

            <button type="submit">
                <big>Register as Student</big>
            </button>

        </form>

        <br>

        <p>
            Already have an account?
            <a href="login.html">Log In</a>
        </p>

        <p>
            <a href="registration-choice.html">
                Back to Account Type Selection
            </a>
        </p>

        <p>
            <a href="homepage.html">Back to Homepage</a>
        </p>

        <hr>

        <p>
            <small>&copy; 2026 InternConnect</small>
        </p>

    </center>

</body>

</html>
