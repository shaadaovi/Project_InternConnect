<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Company Registration | InternConnect</title>
</head>

<body>

    <center>

        <h1>InternConnect</h1>

        <p>
            <em>Company / Recruiter Registration</em>
        </p>

        <hr>

        <h2>Create a Company Account</h2>

        <p>
            Please enter your information to register as a company or recruiter.
        </p>

        <br>

        <form action="company-portal.html" method="get">

            <label for="company-name">
                <strong>Company Name</strong>
            </label>

            <br><br>

            <input type="text"
                   id="company-name"
                   name="company_name"
                   placeholder="Enter your company name"
                   size="35"
                   required>

            <br><br>

            <label for="industry">
                <strong>Industry / Sector</strong>
            </label>

            <br><br>

            <input type="text"
                   id="industry"
                   name="industry"
                   placeholder="e.g. IT, Finance, Marketing"
                   size="35"
                   required>

            <br><br>

            <label for="website">
                <strong>Company Website</strong>
            </label>

            <br><br>

            <input type="url"
                   id="website"
                   name="website"
                   placeholder="https://www.example.com"
                   size="35">

            <br><br>

            <label for="address">
                <strong>Company Address</strong>
            </label>

            <br><br>

            <input type="text"
                   id="address"
                   name="address"
                   placeholder="Enter your company address"
                   size="35"
                   required>

            <br><br>

            <label for="recruiter-name">
                <strong>Recruiter's Full Name</strong>
            </label>

            <br><br>

            <input type="text"
                   id="recruiter-name"
                   name="recruiter_name"
                   placeholder="Enter your full name"
                   size="35"
                   required>

            <br><br>

            <label for="designation">
                <strong>Designation</strong>
            </label>

            <br><br>

            <input type="text"
                   id="designation"
                   name="designation"
                   placeholder="e.g. HR Manager, Recruiter"
                   size="35"
                   required>

            <br><br>

            <label for="email">
                <strong>Official Company Email Address</strong>
            </label>

            <br><br>

            <input type="email"
                   id="email"
                   name="email"
                   placeholder="Enter your company email"
                   size="35"
                   required>

            <br><br>

            <label for="phone">
                <strong>Contact Number</strong>
            </label>

            <br><br>

            <input type="tel"
                   id="phone"
                   name="phone"
                   placeholder="Enter your contact number"
                   size="35"
                   required>

            <br><br>

            <label for="registration-number">
                <strong>Business Registration Number</strong>
            </label>

            <br><br>

            <input type="text"
                   id="registration-number"
                   name="registration_number"
                   placeholder="Enter your registration number"
                   size="35">

            <br><br>

            <label for="password">
                <strong>Password</strong>
            </label>

            <br><br>

            <input type="password"
                   id="password"
                   name="password"
                   placeholder="Create a password"
                   size="35"
                   required>

            <br><br>

            <label for="confirm-password">
                <strong>Confirm Password</strong>
            </label>

            <br><br>

            <input type="password"
                   id="confirm-password"
                   name="confirm_password"
                   placeholder="Re-enter your password"
                   size="35"
                   required>

            <br><br>

            <button type="submit">
                <big>Register as Company / Recruiter</big>
            </button>

        </form>

        <br>

        <p>
            Already have an account?
            <a href="login.html">Log In</a>
        </p>

        <p>
            <a href="registration-choice.html">
                Back to Account Type Selection
            </a>
        </p>

        <p>
            <a href="homepage.html">Back to Homepage</a>
        </p>

        <hr>

        <p>
            <small>&copy; 2026 InternConnect</small>
        </p>

    </center>

</body>

</html>
